<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exchange Marketplace - RentHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-content">
      <h1 class="nav-logo">🏗️ RentHub</h1>
      <div class="nav-menu">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="appraisal.html" class="nav-link">AI Appraisal</a>
        <a href="health-report.html" class="nav-link">Health Reports</a>
        <a href="machine-parts.html" class="nav-link">Machine Parts</a>
        <a href="exchange.html" class="nav-link active">Exchange</a>
      </div>
      <div class="nav-right">
        <span id="userWelcome" class="nav-user"></span>
        <button id="logoutBtn" class="btn btn-secondary btn-small">Logout</button>
      </div>
    </div>
  </nav>
  
  <div class="container">
    <div class="section">
      <h2>🔄 Exchange Marketplace</h2>
      <p>Trade or sell your equipment with others</p>
      <button id="createExchangeBtn" class="btn btn-primary">Create Exchange Offer</button>
    </div>
    
    <div class="section">
      <h3>Active Exchange Offers</h3>
      <div id="exchangesList"></div>
    </div>
  </div>
  
  <!-- Create Exchange Modal -->
  <div id="createExchangeModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Create Exchange Offer</h2>
      <form id="createExchangeForm">
        <div class="form-group">
          <label for="offeredItem">Your Equipment to Offer</label>
          <select id="offeredItem" required></select>
        </div>
        <div class="form-group">
          <label for="requestedItem">Equipment You Want</label>
          <select id="requestedItem" required></select>
        </div>
        <div class="form-group">
          <label for="exchangeType">Exchange Type</label>
          <select id="exchangeType">
            <option value="trade">Trade</option>
            <option value="sell">Sell</option>
            <option value="buy">Buy</option>
          </select>
        </div>
        <div class="form-group">
          <label for="additionalPayment">Additional Payment ($)</label>
          <input type="number" id="additionalPayment" value="0" min="0">
        </div>
        <div class="form-group">
          <label for="exchangeNotes">Notes</label>
          <textarea id="exchangeNotes"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Create Offer</button>
      </form>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
