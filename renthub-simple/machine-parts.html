<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine Parts - RentHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-content">
      <h1 class="nav-logo">🏗️ RentHub</h1>
      <div class="nav-menu">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="appraisal.html" class="nav-link">AI Appraisal</a>
        <a href="health-report.html" class="nav-link">Health Reports</a>
        <a href="machine-parts.html" class="nav-link active">Machine Parts</a>
        <a href="exchange.html" class="nav-link">Exchange</a>
      </div>
      <div class="nav-right">
        <span id="userWelcome" class="nav-user"></span>
        <button id="logoutBtn" class="btn btn-secondary btn-small">Logout</button>
      </div>
    </div>
  </nav>
  
  <div class="container">
    <div class="section">
      <h2>🔩 Machine Parts Locator</h2>
      <p>Interactive diagram showing machine components and part locations</p>
      
      <div class="form-group">
        <label for="partsItem">Select Equipment</label>
        <select id="partsItem"></select>
      </div>
      
      <div id="partsContainer" class="diagram-container">
        <img id="machineImage" class="diagram-image" src="" alt="Machine Diagram">
        <div id="partsMarkers"></div>
      </div>
    </div>
    
    <div class="section" id="industryPartsSection" style="display: none;">
      <h3>Add New Part</h3>
      <form id="addPartForm">
        <div class="form-group">
          <label for="partName">Part Name</label>
          <input type="text" id="partName" required>
        </div>
        <div class="form-group">
          <label for="partNumber">Part Number</label>
          <input type="text" id="partNumber" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Part</button>
      </form>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
