<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentHub - Industrial Equipment Rental Marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="login-card">
      <h1>🏗️ RentHub</h1>
      <p class="subtitle">Industrial Equipment Rental Marketplace with AI</p>
      
      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Register</button>
      </div>
      
      <!-- Login Form -->
      <form id="loginForm" class="form">
        <div class="form-group">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" required placeholder="Enter username">
        </div>
        
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="Enter password">
        </div>
        
        <button type="submit" class="btn btn-primary">Login</button>
        
        <div class="demo-accounts">
          <p><strong>Demo Accounts:</strong></p>
          <p>👤 User: <code>john_user</code> / <code>password123</code></p>
          <p>🏭 Industry: <code>acme_industry</code> / <code>password123</code></p>
        </div>
      </form>
      
      <!-- Register Form -->
      <form id="registerForm" class="form hidden">
        <div class="form-group">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" required placeholder="Choose username">
        </div>
        
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" required placeholder="Enter email">
        </div>
        
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" required placeholder="Choose password">
        </div>
        
        <div class="form-group">
          <label for="regRole">Account Type</label>
          <select id="regRole" required>
            <option value="user">User (Rent Equipment)</option>
            <option value="industry">Industry (List Equipment)</option>
          </select>
        </div>
        
        <div class="form-group" id="companyNameGroup" style="display: none;">
          <label for="regCompany">Company Name</label>
          <input type="text" id="regCompany" placeholder="Enter company name">
        </div>
        
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
      
      <div id="message" class="message"></div>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
